name: Android debug APK

on:
  push:
    branches:
      - "**"
    paths:
      - "android/**"
      - "patches/llama.cpp/**"
      - "vendor.llama.pin"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Build the pinned native inference engine
        env:
          NINJA_JOBS: "2"
        run: |
          export NDK_DIR="$ANDROID_HOME/ndk/28.2.13676358"
          engine_log="$RUNNER_TEMP/edge0-engine-build.log"
          if bash android/tools/llama/build_vendor_libs.sh >"$engine_log" 2>&1; then
            cat "$engine_log"
          else
            status=$?
            cat "$engine_log"
            {
              echo '### Native engine build failed'
              echo '```text'
              tail -n 80 "$engine_log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            details=$(tail -n 30 "$engine_log" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g' -e 's/:/%3A/g' -e 's/,/%2C/g')
            echo "::error title=Native engine build failed::$details"
            exit "$status"
          fi

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: edge0-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
